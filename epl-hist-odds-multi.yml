name: EPL multi-market historical odds (manual)

# Manual trigger only -- no cron, cannot spend credits on its own.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = ONE real snapshot, prints the true credit cost, saves nothing. run = full pull.'
        type: choice
        options: [probe, run]
        default: probe
      date_from:
        description: 'First match date (YYYY-MM-DD)'
        default: '2024-08-16'
      date_to:
        description: 'Last match date (YYYY-MM-DD)'
        default: '2025-05-25'
      markets:
        description: 'Markets (comma-separated)'
        default: 'h2h,totals,spreads'
      bookmakers:
        description: 'Bookmaker keys, max 10, comma-separated'
        default: 'pinnacle,betfair_ex_eu,draftkings,fanduel,betmgm,williamhill'
      max_credits:
        description: 'Abort a run if it spends more than this many credits'
        default: '16000'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull historical odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          EXTRA=""
          if [ "$MODE" = "probe" ]; then EXTRA="--probe"; fi
          python scripts/epl_hist_odds_multi.py \
            --from "${{ inputs.date_from }}" --to "${{ inputs.date_to }}" \
            --markets "${{ inputs.markets }}" --bookmakers "${{ inputs.bookmakers }}" \
            --max-credits "${{ inputs.max_credits }}" $EXTRA
      - name: Commit results
        if: ${{ inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/epl_odds_multi.json
          git commit -m "data: EPL multi-market odds ${{ inputs.date_from }}..${{ inputs.date_to }}" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
