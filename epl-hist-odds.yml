name: EPL historical odds pull (manual)

# Manual trigger only -- no cron, so this can never spend credits on its own.
on:
  workflow_dispatch:
    inputs:
      date_from:
        description: 'First match date (YYYY-MM-DD)'
        default: '2026-08-21'
      date_to:
        description: 'Last match date (YYYY-MM-DD)'
        default: '2026-10-05'
      max_credits:
        description: 'Abort if this run spends more than this many credits'
        default: '700'
      dry_run:
        description: 'true = one cheap discovery call and print the plan, save nothing'
        default: 'true'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull historical odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python scripts/epl_hist_odds.py \
            --from "${{ inputs.date_from }}" --to "${{ inputs.date_to }}" \
            --max-credits "${{ inputs.max_credits }}" $EXTRA
      - name: Commit results
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/epl_hist_odds.json
          git commit -m "data: EPL historical odds ${{ inputs.date_from }}..${{ inputs.date_to }}" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
