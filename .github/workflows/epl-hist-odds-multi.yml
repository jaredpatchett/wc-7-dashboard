name: EPL multi-market historical odds (manual)

# Manual trigger only -- no cron, cannot spend credits on its own.
# Partial results are ALWAYS saved (commit + downloadable artifact), even if the
# run stops early on its credit cap or hits an error. Re-running resumes: kickoffs
# already in data/epl_odds_multi.json are skipped, so no credits are re-spent.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = ONE real snapshot, prints the true credit cost, saves nothing. run = full pull.'
        type: choice
        options: [probe, run]
        default: run
      date_from:
        description: 'First match date (YYYY-MM-DD)'
        default: '2024-08-16'
      date_to:
        description: 'Last match date (YYYY-MM-DD)'
        default: '2025-05-25'
      markets:
        description: 'Markets (comma-separated). h2h,totals = 20 credits per kickoff; each extra market adds 10.'
        default: 'h2h,totals'
      bookmakers:
        description: 'Bookmaker keys, max 10, comma-separated'
        default: 'pinnacle,betfair_ex_eu,draftkings,fanduel,betmgm,williamhill'
      max_credits:
        description: 'Abort a run if it spends more than this many credits'
        default: '7000'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pull historical odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          EXTRA=""
          if [ "$MODE" = "probe" ]; then EXTRA="--probe"; fi
          python scripts/epl_hist_odds_multi.py \
            --from "${{ inputs.date_from }}" --to "${{ inputs.date_to }}" \
            --markets "${{ inputs.markets }}" --bookmakers "${{ inputs.bookmakers }}" \
            --max-credits "${{ inputs.max_credits }}" $EXTRA
      - name: Save data as a downloadable artifact (backup)
        if: ${{ always() && inputs.mode == 'run' }}
        uses: actions/upload-artifact@v4
        with:
          name: epl-odds-multi
          path: data/epl_odds_multi.json
          if-no-files-found: ignore
      - name: Commit results (runs even if the pull stopped early)
        if: ${{ always() && inputs.mode == 'run' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/epl_odds_multi.json ]; then
            git add data/epl_odds_multi.json
            git commit -m "data: EPL multi-market odds ${{ inputs.date_from }}..${{ inputs.date_to }}" || echo "nothing to commit"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          else
            echo "no data file produced"
          fi
