name: EPL event-market probe (manual)

# Manual trigger only. Makes ~8 small calls (roughly 10 credits each) for ONE historical match,
# prints which additional markets (alt spreads/totals, BTTS, props...) exist for which bookmakers.
# Needs data/epl_odds_multi.json to exist (run the multi-market pull first). Saves nothing.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe additional markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/epl_event_probe.py
